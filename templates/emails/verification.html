<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email verification</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
        }

        h2 {
            color: #2c3e50;
        }

        p {
            line-height: 1.6;
        }

        .footer {
            font-size: 12px;
            color: #777;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Email Verification</h2>
        <p>Hi {{.Name}},</p>
        <p>Thank you for registering with our To Do List App!</p>
        <p>Please verify your email address by clicking the link below:</p>
        <p><a href="{{.Link}}">Verify Email</a></p>
        <p>If you did not sign up for this account, please ignore this email.</p>

        <div class="footer">
            <p>- To Do List App</p>
        </div>
    </div>
</body>

</html>
